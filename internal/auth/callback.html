<!doctype html>
<html lang="en"{{if .Failed}} class="failed"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Palbase CLI — {{.Status}}</title>
<style>
/* Palette and type are the Studio design tokens — moss brand on the warm
   charcoal ladder, serif display over a mono utility face — so the CLI's one
   browser surface reads as the same product as the dashboard. Everything is
   inlined because a loopback listener has no asset host and the tab must
   render with the network unavailable. */
:root {
  --bg:      oklch(0.198 0.003 270);
  --panel:   oklch(0.224 0.004 270);
  --border:  oklch(0.282 0.005 270);
  --text:    oklch(0.978 0.002 270);
  --muted:   oklch(0.810 0.006 270);
  --faint:   oklch(0.660 0.008 270);
  --accent:  oklch(0.74 0.16 155);
  --wash:    oklch(0.74 0.16 155 / 0.16);
  --mono:  ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
}
:root.failed {
  --accent: oklch(0.70 0.20 28);
  --wash:   oklch(0.70 0.20 28 / 0.16);
}

/* The light accents sit darker than Studio's success/danger tokens: those are
   sized for badges and dots, while here the accent is also 11px tracked text
   and has to clear 4.5:1 against white. */
@media (prefers-color-scheme: light) {
  :root {
    --bg:      oklch(1 0 0);
    --panel:   oklch(0.978 0.002 270);
    --border:  oklch(0.895 0.005 270);
    --text:    oklch(0.198 0.003 270);
    --muted:   oklch(0.440 0.008 270);
    --faint:   oklch(0.480 0.008 270);
    --accent:  oklch(0.46 0.12 155);
    --wash:    oklch(0.46 0.12 155 / 0.08);
  }
  :root.failed {
    --accent: oklch(0.50 0.20 28);
    --wash:   oklch(0.50 0.20 28 / 0.08);
  }
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  min-height: 100%;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 3rem 1.5rem;
  background: radial-gradient(120% 55% at 50% -8%, var(--wash), transparent 62%), var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 30rem; }

/* The dot in the Palbase mark carries the outcome: moss when the terminal got
   its session, red when it didn't. It is the only place the brand changes. */
.brand { display: flex; align-items: center; gap: 0.625rem; margin: 0 0 3rem; }
.brand svg { width: 20px; height: 20px; display: block; }
.brand path { fill: currentColor; }
.brand circle { fill: var(--accent); }
.brand span {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
}

.status {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 1.5rem;
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.status::before {
  content: "";
  flex: none;
  width: 1.75rem;
  height: 1px;
  background: currentColor;
}

h1 {
  margin: 0 0 0.75rem;
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(28px, 7vw, 36px);
  line-height: 1.08;
  letter-spacing: -0.02em;
}

.lede { margin: 0; max-width: 27rem; color: var(--muted); }

.reason {
  margin: 1.5rem 0 0;
  padding: 0.75rem 0.9rem;
  border-left: 2px solid var(--accent);
  border-radius: 0 4px 4px 0;
  background: var(--panel);
  color: var(--text);
  font-size: 12px;
  overflow-wrap: anywhere;
}

/* The footer is the one fact the tab can't infer: which credential set the
   CLI just filled. It rides on every outcome, so it stays quiet. */
.meta {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.4rem 1.75rem;
  margin: 3rem 0 0;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 11px;
}
.meta dt { color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; }
.meta dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
main > * { animation: rise 460ms cubic-bezier(0.16, 1, 0.3, 1) backwards; }
main > :nth-child(2) { animation-delay: 60ms; }
main > :nth-child(3) { animation-delay: 100ms; }
main > :nth-child(4) { animation-delay: 140ms; }
main > :nth-child(5) { animation-delay: 180ms; }
main > :nth-child(6) { animation-delay: 220ms; }

@media (prefers-reduced-motion: reduce) {
  main > * { animation: none; }
}
</style>
</head>
<body>
<main>
  <p class="brand">
    <svg viewBox="14 8 42 42" aria-hidden="true">
      <path d="M18 46V18h17.5c6.3 0 10.5 4.1 10.5 10.1 0 6.1-4.2 10.2-10.5 10.2H27v7.7h-9Zm9-15.6h7.4c1.7 0 2.8-.9 2.8-2.3 0-1.5-1.1-2.4-2.8-2.4H27v4.7Z"/>
      <circle cx="48" cy="17" r="5"/>
    </svg>
    <span>Palbase CLI</span>
  </p>
  <p class="status">{{.Status}}</p>
  <h1>{{.Headline}}</h1>
  <p class="lede">{{.Lede}}</p>
{{- if .Reason}}
  <p class="reason">{{.Reason}}</p>
{{- end}}
{{- if .Meta}}
  <dl class="meta">
{{- range .Meta}}
    <dt>{{.Label}}</dt><dd>{{.Value}}</dd>
{{- end}}
  </dl>
{{- end}}
</main>
</body>
</html>
