# Palbase while you are writing it — the same product, three containers.
#
#   postgres   the stack's one database
#   palsvc     every module in one process — and, here, the WHOLE ADDRESS
#   runtime    your controllers, built from the directory you are editing
#
# ── why there is no envoy, and what took its place ──────────────────────────
#
# The shipped stack (docker-compose.yml) has four containers, and the fourth is
# an edge that terminates TLS. Here it would be in the way twice over: it needs
# a certificate, and a certificate you made yourself is one your phone, your
# browser and every SDK on your machine will refuse — which turns "run the
# stack" into an afternoon of trust stores. So: plain HTTP, no edge.
#
# But envoy was never only TLS. It is the process that decides WHICH of the two
# below answers a given path: a handful of platform prefixes (/auth, /v1,
# /realtime, …) go to palsvc, and EVERYTHING ELSE goes to the runtime, because
# `@Controller("/todos")` has to answer at /todos. Delete the edge and that
# decision goes with it — leaving a developer holding two ports and an SDK that
# only knows how to be given one.
#
# So palsvc makes it. RUNTIME_PROXY_URL below turns on the fallthrough in
# internal/server/runtimeproxy.go: a path palsvc claims it serves, and a path it
# does not it proxies to `runtime`. The claimed list is READ FROM ITS OWN
# ROUTER, so it cannot drift from what palsvc actually serves — and the rule is
# the same one envoy applies, down to /auth claiming /auth/... and not /authors.
# One address, ${PALBASE_HTTP_PORT}, and it behaves like the deployed one.
#
# ── and no deploy ───────────────────────────────────────────────────────────
#
# The runtime here does not download an artifact. It BUILDS the project you
# mounted, with the deploy's own bundler (runtime/scripts/bundle-controllers.sh
# — the same stager, the same `bun build`, the same zero-controller and @Upload
# gates), watches its source, and rebuilds in place when you save. Nothing is
# pushed, nothing is activated, and what you see is what a push would ship,
# because it is the same build.
#
# ── THE IMAGES ARE BUILT SEPARATELY, ON PURPOSE ─────────────────────────────
#
# Both services name an `image:`, not a `build:`, and this file cannot bring
# itself up. That is not a simplification — `docker compose build` requires
# buildx >= 0.17 and refuses on machines that run this stack perfectly (measured
# on the machine this file was written for: buildx 0.11, "compose build requires
# buildx 0.17.0 or later"). A `build:` section here would mean the one command
# this file exists to make possible could not run.
#
# So the two images are built with plain BuildKit, which works everywhere:
#
#   cd v2         && DOCKER_BUILDKIT=1 docker build -t palbase-palsvc -f Dockerfile .
#   cd v2/runtime && DOCKER_BUILDKIT=1 docker build --target dev -t palbase-runtime-dev -f Dockerfile .
#
# `--target dev` is not optional: the production target carries neither the
# bundler nor a TypeScript compiler. A runtime started from it REFUSES TO BOOT
# and prints the line above — it does not come up and fail later, which is what
# it used to do (up, then every save rejected with "ships no stager").
#
# AND THE TAG IS `palbase-runtime-dev`, not `palbase-runtime`. The shipped
# stack's compose builds its runtime under the plain name; writing the dev image
# over that tag would leave the production stack running a dev image the next
# time it is recreated. palsvc's image is byte-identical in both stacks, so it
# keeps the plain name.
#
# PALBASE_PALSVC_IMAGE / PALBASE_RUNTIME_IMAGE override both, for a published
# image or a second build.
#
# ── before the first `docker compose up` ────────────────────────────────────
#
# NOTHING HERE HAS A DEFAULT PORT and nothing here has a default secret. Both
# are deliberate: a fixed port collides with the stack you already have running,
# and a shipped default password is a shipped credential.
#
#   PALBASE_HTTP_PORT     the one address — palsvc's port, published to the host
#   PALBASE_PG_PORT       postgres, published so psql and a GUI can reach it
#   PALBASE_PROJECT_DIR   the project to serve (the directory holding
#                         controllers/, models/, services/, config/, db/)
#
# Both ports are published on 127.0.0.1 and nowhere else. A dev stack holds a
# real database password and a service_role key, and Docker's default
# `<port>:<port>` binds every interface — which on a laptop means the café wifi.
# Reaching it from a phone on the same network is a deliberate act (an ssh
# tunnel, or an explicit `-p 0.0.0.0:…` override), not the default.
#
# Everything else is the SAME environment docker-compose.yml reads — one
# `--env-file` works for both, and there is no secret in this file that is not
# in that one:
#
#   docker compose -f deploy/docker-compose.dev.yml -p palbase-dev \
#     --env-file .verify/.env up -d
#
# with PALBASE_HTTP_PORT / PALBASE_PG_PORT / PALBASE_PROJECT_DIR exported or in
# that same env file. The database still needs its schema before anything
# serves, which is the same one-shot the shipped stack uses:
#
#   docker compose -f deploy/docker-compose.dev.yml -p palbase-dev \
#     --env-file <env> run --rm --no-deps palsvc --migrate-only
#
# ── one thing to know about file ownership ──────────────────────────────────
#
# The bundler writes .palbase/ INTO the project, the way it does when you run it
# by hand. The runtime container is uid 1000, so on Linux the project directory
# has to be writable by uid 1000; on Docker Desktop the bind mount is presented
# as the container's user and there is nothing to do.

# A name of its own, so bringing this up cannot disturb the four-container stack
# that may already be running under `palbase`. Override with -p if you want two
# of these at once.
name: palbase-dev

services:

  # ── postgres ───────────────────────────────────────────────────────────────
  #
  # The same image and the same healthcheck as the shipped stack — including
  # `-h 127.0.0.1`, which is not a detail: over the unix socket pg_isready
  # answers "ready" to the TEMPORARY server initdb runs, about a second and a
  # half before a real one exists, and whatever `service_healthy` releases
  # connects into that gap.
  #
  # Unlike the shipped stack this one PUBLISHES its port, because the point of a
  # development stack is that you can look inside it.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: palbase
      POSTGRES_DB: palbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      # 127.0.0.1 only. See the header: this database has a real password and
      # binding every interface puts it on whatever network the laptop is on.
      - "127.0.0.1:${PALBASE_PG_PORT:?set PALBASE_PG_PORT — this file names no port, so two stacks never collide}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U palbase -d palbase"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # ── palsvc ─────────────────────────────────────────────────────────────────
  #
  # Every module in one process, and here also the edge. Same image as the
  # shipped stack, same role-mask, same everything except two lines: the port is
  # published, and RUNTIME_PROXY_URL is set.
  palsvc:
    # PULLED by default, so `palbase start` works on a machine that has never
    # seen this repository. Building locally? Set PALBASE_PALSVC_IMAGE to your
    # own tag — the CLI prints the build command when an image is missing.
    image: ${PALBASE_PALSVC_IMAGE:-ghcr.io/palgroup/palbase-palsvc:0.29.1}
    command:
      - "--modules"
      - "deeplinks,documents,flags,analytics,messaging,db,auth,rt,notify,vault,storage"
    ports:
      # 127.0.0.1 only — this is the whole address of a stack holding a
      # service_role key. See the header.
      # PALBASE_HTTP_BIND is 127.0.0.1 unless somebody deliberately widened it
      # (`palbase start --lan`), which is the only way a phone on the same
      # wifi can reach this. The default stays loopback because the header
      # above is right: this address serves a stack holding a real database
      # password, and a laptop is not always on a network you chose.
      - "${PALBASE_HTTP_BIND:-127.0.0.1}:${PALBASE_HTTP_PORT:?set PALBASE_HTTP_PORT — this file names no port, so two stacks never collide}:8080"
    volumes:
      - artifacts:/var/lib/palbase/artifacts
      - storage:/var/lib/palbase/storage
    environment:
      # ── the edge, in one variable ────────────────────────────────────────
      #
      # Unset in the shipped stack, where envoy decides this. Set here, where
      # nothing else can: a path palsvc does not claim is proxied to `runtime`
      # instead of answered 404. By compose service name, so the hop stays on
      # this network.
      RUNTIME_PROXY_URL: http://runtime:4005
      PALSVC_ARTIFACT_ROOT: /var/lib/palbase/artifacts
      DATABASE_URL: postgres://palbase:${POSTGRES_PASSWORD:-}@postgres:5432/palbase?sslmode=disable
      LOCAL_JWT_PEM: ${LOCAL_JWT_PEM:-}
      STACK_ROOT_KEY: ${STACK_ROOT_KEY:-}
      PEPPER: ${PEPPER:-}
      REALTIME_INGESTION_SECRET: ${REALTIME_INGESTION_SECRET:-}
      GATEWAY_ISSUER: ${GATEWAY_ISSUER:-palbase}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      PALBASE_STACK_REF: ${PALBASE_STACK_REF:-project}
      PALBASE_RUNTIME_URL: ${PALBASE_RUNTIME_URL:-http://runtime:4005}
      PALBASE_ANON_KEY: ${PALBASE_ANON_KEY:-}
      PALBASE_SERVICE_ROLE_KEY: ${PALBASE_SERVICE_ROLE_KEY:-}
      # E-mail and SMS, carried verbatim from the shipped stack so ONE env file
      # drives both. Unset means the channel is undeliverable and says so at
      # boot, per channel — it does not mean "off quietly".
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__PROVIDER: ${SMTP_PROVIDER:-}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__SMTP_HOST: ${SMTP_HOST:-}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__SMTP_PORT: ${SMTP_PORT:-587}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__SMTP_USERNAME: ${SMTP_USERNAME:-}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      PALNOTIFY_SHARED_PROVIDERS__EMAIL__FROM_NAME: ${SMTP_FROM_NAME:-}
      PALNOTIFY_SHARED_PROVIDERS__SMS__ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      PALNOTIFY_SHARED_PROVIDERS__SMS__FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      PALNOTIFY_SHARED_PROVIDERS__SMS__VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      PALSVC_TELEMETRY_OTLP_ENDPOINT: ${PALSVC_TELEMETRY_OTLP_ENDPOINT:-}
      PALSVC_TELEMETRY_PROMETHEUS: ${PALSVC_TELEMETRY_PROMETHEUS:-}
      PALSVC_TELEMETRY_PUSH_INTERVAL: ${PALSVC_TELEMETRY_PUSH_INTERVAL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── runtime ────────────────────────────────────────────────────────────────
  #
  # YOUR CODE, from the directory you are editing. The image must be the
  # runtime Dockerfile's `dev` TARGET — the same image with two additions the
  # build needs, the bundler script and the TypeScript compiler the stager reads
  # return types with (see the Dockerfile, and the build line in the header).
  # Built from the production target instead, this comes up and then refuses
  # every rebuild with "this project's @palbase/backend ships no stager".
  #
  # No `bun --watch`: restarting this process on every save would throw away the
  # database pool and the warm secrets, and the reload it would be standing in
  # for is already here — src/dev.ts rebuilds the bundle and swaps the app in
  # place, clearing the controller registry first so the new code is what
  # answers. A build that fails does NOT take the process down; the previous one
  # goes on serving and the bundler's own message is printed.
  runtime:
    # The DEV target, pulled: it carries the bundler and TypeScript the stager
    # needs. The production image comes up healthy and then refuses every save.
    image: ${PALBASE_RUNTIME_IMAGE:-ghcr.io/palgroup/palbase-runtime-dev:0.29.1}
    environment:
      # The switch. With it set, the artifact path is not taken at all — there
      # is no ARTIFACT_BLOB_URL here and nothing looks for one.
      PALBASE_DEV_CONTROLLERS: /app/project
      PALBASE_STACK_REF: ${PALBASE_STACK_REF:-project}
      DATABASE_URL: postgres://palbase:${POSTGRES_PASSWORD:-}@postgres:5432/palbase?sslmode=disable
      DB_ROLE: ${RUNTIME_DB_ROLE:-backend_authenticated}
      DB_POOL_MAX: ${RUNTIME_DB_POOL_MAX:-32}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://palsvc:8080/.well-known/jwks.json}
      MODULE_BASE_URL: ${MODULE_BASE_URL:-http://palsvc:8080}
      PALBASE_ANON_KEY: ${PALBASE_ANON_KEY:-}
      PALBASE_SERVICE_ROLE_KEY: ${PALBASE_SERVICE_ROLE_KEY:-}
      REALTIME_INGESTION_SECRET: ${REALTIME_INGESTION_SECRET:-}
    volumes:
      # The project, read-WRITE: the bundler writes .palbase/ into it, exactly
      # as it does when a deploy runs it on your machine.
      - ${PALBASE_PROJECT_DIR:?set PALBASE_PROJECT_DIR — the project this stack serves}:/app/project
      # Built bundles. A build per save, pruned to the last few by src/dev.ts.
      - artifactcache:/var/cache/palbase/artifacts
    # NOT `node_modules` — the project's own dependencies are its own, and the
    # bundle a deploy produces inlines whatever the project resolved. Masking
    # them would build something different here from what ships. The image
    # carries an @palbase/backend and a TypeScript one directory up, at
    # /app/node_modules, so a project that has never been `npm install`ed still
    # builds: resolution walks out of /app/project and finds them.
    depends_on:
      palsvc:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  artifactcache:
  # palsvc still serves /_artifacts and can still be pushed to. Nothing in this
  # stack READS what lands there — the runtime is serving your directory — so a
  # push here builds an artifact and activates a pointer nobody follows. Said
  # out loud because "I pushed and nothing changed" has an answer, and it is
  # this line.
  artifacts:
  storage:

# NO `networks:` BLOCK, and that absence is load-bearing.
#
# It used to pin `default: name: palbase-dev`, which put EVERY dev stack on ONE
# network whatever `-p` it was given. Measured 2026-08-17: a second project came
# up, its palsvc resolved `postgres` to the FIRST project's database and died on
# SASL auth — and with matching passwords it would not have died, it would have
# served one project's backend from another project's data. Compose's default is
# a network per project, which is the isolation the `-p` was for.
