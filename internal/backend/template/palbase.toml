# Palbase backend project config.
# `palbase backend dev` and `deploy` read this file from cwd.

[project]
# Filled in by `palbase backend init`. Keep this in sync with the
# remote project ref so dev and deploy target the same env.
ref = ""

[backend]
runtime = "node"          # `node` | `v8-isolate` (future)
timeout_seconds = 30
memory_mb = 256
