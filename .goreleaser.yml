version: 2

project_name: palbase

builds:
  - main: ./cmd/palbase
    binary: palbase
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "palbase_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: palbase
    directory: Formula
    repository:
      owner: palgroup
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://palbase.studio"
    description: "Palbase CLI — develop backend code and deploy it to environments"
    # `palbase pull` shells out to the system git for its 3-way merge / conflict
    # markers, so guarantee git is present.
    dependencies:
      - name: git
    install: |
      bin.install "palbase"
    test: |
      system "#{bin}/palbase", "--version"

release:
  draft: false
