version: 2

project_name: palbase

builds:
  - main: ./cmd/palbase
    binary: palbase
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "palbase_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: palbase
    repository:
      owner: seklabsnet
      name: homebrew-tap
    homepage: "https://palbase.io"
    description: "Palbase CLI — develop, test, and deploy backend projects"
    install: |
      bin.install "palbase"
    test: |
      system "#{bin}/palbase", "--version"

release:
  draft: false
