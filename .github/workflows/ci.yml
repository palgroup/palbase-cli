name: cli ci

# Build + vet + unit gate on every push to main and on PRs. Before this
# workflow existed, the 43 test files only ran in the tag-triggered Release
# workflow — pushes to main between releases ran nothing.
#
# The test invocation mirrors release.yml exactly (go test ./... -race
# -count=1); the e2e suite under tests/e2e is gated by the `e2e` build tag
# and needs a live dev stack, so it stays out of this gate by construction.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: build + vet + unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # Same flags as the Release workflow's test gate. internal/backend
        # tests exercise the local dev-server path via the runner's
        # preinstalled Node (exec.LookPath("node")).
        run: go test ./... -race -count=1

      # v2.12.2 supports Go 1.26, but the CLI still has pre-existing errcheck
      # debt. Keep the exact pinned scan visible while vet remains blocking.
      - name: Lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
