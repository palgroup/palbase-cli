name: Release

on:
  push:
    tags:
      - "v*"
  # THE TAG PUSH IS NOT A RELIABLE TRIGGER, and that was measured rather than
  # assumed: on 2026-08-26 GitHub Actions was in a major outage that stopped
  # delivering PUSH events while `workflow_dispatch` kept running. `v0.46.0` and
  # `v0.46.1` were both pushed and neither produced a run — the commit had no
  # `github-actions` check-suite at all, while the previous release's commit did.
  #
  # A release path with ONE trigger is a release path that is down whenever that
  # trigger is, and a fix that cannot be shipped is a fix that does not exist.
  # So the tag can also be released by hand, from the tag itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.46.1 (use when a tag push did not reach Actions)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # THE INPUT REACHES `ref:`, SO ITS SHAPE IS CHECKED FIRST. Dispatch is
      # write-access-only, but "the person could have pushed it anyway" is not a
      # reason to hand an unvalidated string to checkout — it is the reason the
      # blast radius is small, not the reason the check is unnecessary. It goes
      # through env:, never straight into the run: line.
      - name: Check the tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::not a release tag: expected vMAJOR.MINOR.PATCH"
            exit 1
          }

      # CHECK OUT THE TAG, not the branch: goreleaser reads the version from the
      # tag on HEAD, so a dispatch run standing on `main` would either refuse or
      # publish a snapshot under a name nobody asked for. Pinned to the `tags`
      # namespace so the input cannot name a branch or a raw sha.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      # bun, because the CLI builds a backend with it and several tests exercise
      # that path. Without it they SKIP, so the gate on a release would be quietly
      # thinner than the gate a developer runs — which is the shape of a release
      # that passes and ships something nobody tested.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Generate GitHub App token for palgroup/homebrew-tap
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PALBASE_CI_APP_ID }}
          private-key: ${{ secrets.PALBASE_CI_APP_PRIVATE_KEY }}
          owner: palgroup
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
